<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact • Neon Portfolio</title>
  <link rel="stylesheet" href="style1.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body class="inner-page">
  <nav class="topbar">
    <a class="back" href="index.html" aria-label="Back to home">← Home</a>
  </nav>

  <main class="panel contact-panel">
    
   
   
  <h2>Contact Me</h2>

  <form id="contactForm">
    <label>Name</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label>Email</label>
    <input type="email" id="email" placeholder="Enter your email">

    <label>Message</label>
    <textarea id="message" placeholder="Write your message..."></textarea>

    <button type="submit">Send</button>

    <p id="formStatus"></p>
    
       <div class="contact-socials">
      <a href="https://www.linkedin.com/in/manya21/" target="_blank">
        <i class="fa-brands fa-linkedin"></i>
      </a>

      <a href="https://github.com/lego03" target="_blank">
        <i class="fa-brands fa-github"></i>
      </a>
    </div>
    
  </form>

  </main>


  <script src="script.js"></script>

</body>
</html>
